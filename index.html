<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315c4b">
  <meta name="description" content="Biblioteca personal de estudio sin conexión.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/biblioteca.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Mi Biblioteca de Estudio</title>
</head>
<body>
  <header class="barra-superior">
    <button id="abrir-indice" class="solo-movil" aria-label="Abrir índice">☰</button>
    <div><p class="marca">MI BIBLIOTECA</p><h1 id="titulo-libro">Mi Biblioteca</h1></div>
    <div class="acciones-superiores">
      <button id="abrir-buscador" class="secundario">🔎 Buscar</button>
      <button id="agregar-recurso">＋ Recurso</button>
      <button id="instalar" class="secundario" hidden>Instalar</button>
    </div>
  </header>
  <div id="pestanas" class="pestanas" aria-label="Recursos abiertos"></div>
  <main class="aplicacion">
    <aside id="panel-indice" class="indice" aria-label="Índice del libro">
      <div class="indice-cabecera"><h2>Índice</h2><button id="cerrar-indice" class="solo-movil" aria-label="Cerrar índice">×</button></div>
      <nav id="lista-indice"></nav>
    </aside>
    <section class="lector" aria-live="polite">
      <div class="herramientas">
        <div class="tamano" aria-label="Tamaño de letra"><span>Texto</span><button id="disminuir" aria-label="Disminuir tamaño de letra">A−</button><button id="aumentar" aria-label="Aumentar tamaño de letra">A+</button></div>
        <div class="audio"><button id="escuchar">▶ Escuchar</button><button id="pausar" disabled>⏸ Pausar</button><button id="detener" disabled>■ Detener</button></div>
      </div>
      <p id="estado" class="estado"></p><article id="contenido" class="contenido"></article>
      <div class="navegacion"><button id="anterior" class="secundario">← Anterior</button><button id="siguiente">Siguiente →</button></div>
    </section>
  </main>
  <div id="modal-recursos" class="modal" hidden><div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="titulo-recursos"><div class="modal-cabecera"><div><p class="marca">MI BIBLIOTECA</p><h2 id="titulo-recursos">Agregar recurso</h2></div><button id="cerrar-recursos" class="secundario" aria-label="Cerrar">×</button></div><p class="modal-ayuda">Elige un libro, Biblia, diccionario o léxico. Se abrirá como una nueva pestaña de estudio.</p><div id="lista-recursos" class="lista-recursos"></div></div></div>
  <div id="modal-busqueda" class="modal" hidden><div class="modal-caja modal-busqueda-caja" role="dialog" aria-modal="true" aria-labelledby="titulo-busqueda"><div class="modal-cabecera"><div><p class="marca">INVESTIGACIÓN</p><h2 id="titulo-busqueda">Buscar en la biblioteca</h2></div><button id="cerrar-busqueda" class="secundario" aria-label="Cerrar">×</button></div><div class="busqueda-controles"><input id="campo-busqueda" type="search" placeholder="Palabra, frase, griego, español, Strong..." autocomplete="off"><select id="modo-busqueda" aria-label="Alcance de búsqueda"><option value="abiertos">En recursos abiertos</option><option value="toda">En toda la biblioteca</option></select><button id="ejecutar-busqueda">Buscar</button></div><p id="estado-busqueda" class="estado"></p><div id="resultados-busqueda" class="resultados-busqueda"></div></div></div>
  <script src="assets/js/adaptadores-json.js"></script>
  <script>
  (function(){
    const $=id=>document.getElementById(id);
    const normalizar=v=>String(v||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
    const obtenerCapitulo=t=>{const m=String(t||'').trim().match(/^(.*?)\s+(\d+)$/);return m?{libro:m[1].trim(),capitulo:Number(m[2])}:null;};

    function esBibliaActiva(){
      const titulo=normalizar($('titulo-libro')?.textContent||'');
      return /biblia|rvr|reina valera|dios habla hoy|nvi|strong/.test(titulo);
    }

    function prepararIndice(){
      document.querySelectorAll('#lista-indice button.indice-item').forEach(b=>{
        if(b.dataset.referencia)return;
        const d=obtenerCapitulo(b.textContent);
        if(d)b.dataset.referencia=`${d.libro} ${d.capitulo}`;
      });
    }

    function esIndiceBiblico(){
      const l=$('lista-indice');
      if(!l)return false;
      const b=[...l.querySelectorAll('button.indice-item')];
      return b.length>0&&b.some(x=>obtenerCapitulo(x.dataset.referencia||x.textContent));
    }

    function organizar(){
      const l=$('lista-indice');
      if(!l||l.dataset.fase1Organizado==='1'||!esBibliaActiva())return;
      const b=[...l.children].filter(x=>x.matches('button.indice-item'));
      if(!b.length)return;
      const datos=b.map(x=>({btn:x,d:obtenerCapitulo(x.dataset.referencia||x.textContent)}));
      if(datos.some(x=>!x.d))return;
      const grupos=new Map();
      datos.forEach(x=>{const k=normalizar(x.d.libro);if(!grupos.has(k))grupos.set(k,{nombre:x.d.libro,botones:[]});grupos.get(k).botones.push(x.btn);});
      l.replaceChildren();
      grupos.forEach(g=>{
        const det=document.createElement('details');det.className='indice-libro';det.open=false;
        const sum=document.createElement('summary');sum.textContent=g.nombre;det.append(sum);
        const caps=document.createElement('div');caps.className='indice-capitulos';
        g.botones.forEach(btn=>{const d=obtenerCapitulo(btn.dataset.referencia||btn.textContent);btn.dataset.referencia=`${d.libro} ${d.capitulo}`;btn.textContent=`Capítulo ${d.capitulo}`;caps.append(btn);});
        det.append(caps);l.append(det);
      });
      l.dataset.fase1Organizado='1';
    }

    function crearBuscadorIndice(){
      const indice=$('panel-indice');
      if(!indice||$('buscador-indice-biblico')||!esBibliaActiva())return;
      const caja=document.createElement('div');
      caja.id='buscador-indice-biblico';
      caja.className='indice-busqueda activo';
      caja.innerHTML='<label for="campo-indice-biblico">Ir a pasaje bíblico</label><div class="indice-busqueda-controles"><input id="campo-indice-biblico" type="search" placeholder="Génesis 1:1 o Mateo 5" autocomplete="off"><button id="ir-indice-biblico" type="button">Ir</button></div><small>Busca el libro y capítulo directamente en el índice.</small><p id="estado-indice-biblico" class="indice-busqueda-estado"></p>';
      indice.querySelector('.indice-cabecera').insertAdjacentElement('afterend',caja);
      const ejecutar=()=>irAPasaje($('campo-indice-biblico')?.value||'');
      $('ir-indice-biblico').addEventListener('click',ejecutar);
      $('campo-indice-biblico').addEventListener('keydown',e=>{if(e.key==='Enter')ejecutar();});
    }

    function encontrar(libro,capitulo){
      const q=normalizar(`${libro} ${capitulo}`);
      const botones=[...document.querySelectorAll('#lista-indice button.indice-item')];
      return botones.find(b=>normalizar(b.dataset.referencia||b.textContent)===q)||null;
    }

    function irAPasaje(valor){
      const v=String(valor||'').trim();
      const estado=$('estado-indice-biblico');
      if(estado)estado.textContent='';
      if(!v){$('campo-indice-biblico')?.focus();return;}
      const m=v.match(/^(.+?)\s+(\d+)(?::(\d+))?$/);
      if(!m){if(estado)estado.textContent='Escribe, por ejemplo: Mateo 5 o Juan 3:16.';return;}
      const libro=m[1].trim(),capitulo=Number(m[2]),versiculo=m[3]?Number(m[3]):null;
      const boton=encontrar(libro,capitulo);
      if(!boton){if(estado)estado.textContent=`No encontré ${libro} ${capitulo} en el índice de la Biblia abierta.`;return;}
      const detalle=boton.closest('details');
      if(detalle)detalle.open=true;
      boton.click();
      if(versiculo)setTimeout(()=>{
        const patron=new RegExp(`^${versiculo}(?:\\s|$)`);
        const p=[...document.querySelectorAll('#contenido p')].find(x=>patron.test(x.textContent.trim()));
        if(p){p.classList.add('versiculo-destacado');p.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>p.classList.remove('versiculo-destacado'),2200);}
      },160);
    }

    function actualizarInterfaz(){
      const existente=$('buscador-indice-biblico');
      if(esBibliaActiva()){
        prepararIndice();
        organizar();
        if(!existente)crearBuscadorIndice();
      }else if(existente){existente.remove();}
    }

    function observar(){
      const l=$('lista-indice');
      const t=$('titulo-libro');
      if(l&&!l.dataset.fase1Observado){
        l.dataset.fase1Observado='1';
        new MutationObserver(()=>setTimeout(actualizarInterfaz,0)).observe(l,{childList:true,subtree:true});
      }
      if(t&&!t.dataset.fase1TituloObservado){
        t.dataset.fase1TituloObservado='1';
        new MutationObserver(actualizarInterfaz).observe(t,{childList:true,characterData:true,subtree:true});
      }
      actualizarInterfaz();
    }

    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',observar,{once:true});else observar();
  })();
  </script>
  <script src="assets/js/biblioteca.js"></script>
</body>
</html>
