<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315c4b">
  <meta name="description" content="Biblioteca personal de estudio sin conexión.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/biblioteca.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Mi Biblioteca de Estudio</title>
</head>
<body>
  <header class="barra-superior">
    <button id="abrir-indice" class="solo-movil" aria-label="Abrir índice">☰</button>
    <div><p class="marca">MI BIBLIOTECA</p><h1 id="titulo-libro">Mi Biblioteca</h1></div>
    <div class="acciones-superiores">
      <button id="abrir-buscador" class="secundario">🔎 Buscar</button>
      <button id="agregar-recurso">＋ Recurso</button>
      <button id="instalar" class="secundario" hidden>Instalar</button>
    </div>
  </header>
  <div id="pestanas" class="pestanas" aria-label="Recursos abiertos"></div>
  <main class="aplicacion">
    <aside id="panel-indice" class="indice" aria-label="Índice del libro">
      <div class="indice-cabecera"><h2>Índice</h2><button id="cerrar-indice" class="solo-movil" aria-label="Cerrar índice">×</button></div>
      <nav id="lista-indice"></nav>
    </aside>
    <section class="lector" aria-live="polite">
      <div class="herramientas">
        <div class="tamano" aria-label="Tamaño de letra"><span>Texto</span><button id="disminuir" aria-label="Disminuir tamaño de letra">A−</button><button id="aumentar" aria-label="Aumentar tamaño de letra">A+</button></div>
        <div class="audio"><button id="escuchar">▶ Escuchar</button><button id="pausar" disabled>⏸ Pausar</button><button id="detener" disabled>■ Detener</button></div>
      </div>
      <p id="estado" class="estado"></p><article id="contenido" class="contenido"></article>
      <div class="navegacion"><button id="anterior" class="secundario">← Anterior</button><button id="siguiente">Siguiente →</button></div>
    </section>
  </main>
  <div id="modal-recursos" class="modal" hidden><div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="titulo-recursos"><div class="modal-cabecera"><div><p class="marca">MI BIBLIOTECA</p><h2 id="titulo-recursos">Agregar recurso</h2></div><button id="cerrar-recursos" class="secundario" aria-label="Cerrar">×</button></div><p class="modal-ayuda">Elige un libro, Biblia, diccionario o léxico. Se abrirá como una nueva pestaña de estudio.</p><div id="lista-recursos" class="lista-recursos"></div></div></div>
  <div id="modal-busqueda" class="modal" hidden><div class="modal-caja modal-busqueda-caja" role="dialog" aria-modal="true" aria-labelledby="titulo-busqueda"><div class="modal-cabecera"><div><p class="marca">INVESTIGACIÓN</p><h2 id="titulo-busqueda">Buscar en la biblioteca</h2></div><button id="cerrar-busqueda" class="secundario" aria-label="Cerrar">×</button></div><div class="busqueda-controles"><input id="campo-busqueda" type="search" placeholder="Palabra, frase, griego, español, Strong..." autocomplete="off"><select id="modo-busqueda" aria-label="Alcance de búsqueda"><option value="abiertos">En recursos abiertos</option><option value="toda">En toda la biblioteca</option></select><button id="ejecutar-busqueda">Buscar</button></div><p id="estado-busqueda" class="estado"></p><div id="resultados-busqueda" class="resultados-busqueda"></div></div></div>
  <script src="assets/js/adaptadores-json.js"></script>
  <script>
  (function(){
    const $=id=>document.getElementById(id);
    function normalizar(v){return String(v||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();}
    function obtenerCapitulo(t){const m=String(t||'').trim().match(/^(.*?)\s+(\d+)$/);return m?{libro:m[1].trim(),capitulo:Number(m[2])}:null;}
    function esIndiceBiblico(){const l=$('lista-indice');if(!l)return false;const b=[...l.querySelectorAll(':scope > button.indice-item')];return b.length>0&&b.every(x=>obtenerCapitulo(x.dataset.referencia||x.textContent));}
    function preparar(){document.querySelectorAll('#lista-indice button.indice-item').forEach(b=>{if(!b.dataset.referencia){const d=obtenerCapitulo(b.textContent);if(d)b.dataset.referencia=`${d.libro} ${d.capitulo}`;}});}
    function organizar(){const l=$('lista-indice');if(!l)return;const b=[...l.children].filter(x=>x.matches('button.indice-item'));if(!b.length)return;const datos=b.map(x=>({btn:x,d:obtenerCapitulo(x.dataset.referencia||x.textContent)}));if(datos.some(x=>!x.d))return;const grupos=new Map();datos.forEach(x=>{const k=normalizar(x.d.libro);if(!grupos.has(k))grupos.set(k,{nombre:x.d.libro,botones:[]});grupos.get(k).botones.push(x.btn);});l.replaceChildren();grupos.forEach(g=>{const det=document.createElement('details');det.className='indice-libro';det.open=false;const sum=document.createElement('summary');sum.textContent=g.nombre;det.append(sum);const caps=document.createElement('div');caps.className='indice-capitulos';g.botones.forEach(btn=>{const d=obtenerCapitulo(btn.dataset.referencia||btn.textContent);btn.dataset.referencia=`${d.libro} ${d.capitulo}`;btn.textContent=`Capítulo ${d.capitulo}`;caps.append(btn);});det.append(caps);l.append(det);});}
    function crearBuscador(){const h=document.querySelector('.lector .herramientas');if(!h||$('buscador-referencia'))return;const b=document.createElement('div');b.id='buscador-referencia';b.className='referencia-biblica';b.innerHTML='<label for="campo-referencia">Ir a referencia bíblica</label><div class="referencia-controles"><input id="campo-referencia" type="search" placeholder="Génesis 1:1" autocomplete="off"><button id="ir-referencia" type="button">Ir</button></div><small>Ejemplo: Génesis 1 · Juan 3:16</small>';h.insertAdjacentElement('afterend',b);const ejecutar=()=>irAReferencia($('campo-referencia')?.value||'');$('ir-referencia').addEventListener('click',ejecutar);$('campo-referencia').addEventListener('keydown',e=>{if(e.key==='Enter')ejecutar();});}
    function encontrar(libro,cap){const q=normalizar(`${libro} ${cap}`);return [...document.querySelectorAll('#lista-indice button.indice-item')].find(b=>normalizar(b.dataset.referencia||b.textContent)===q)||null;}
    function mensaje(t){if($('estado'))$('estado').textContent=t;}
    function irAReferencia(ref){const v=String(ref||'').trim();if(!v){$('campo-referencia')?.focus();return;}const m=v.match(/^(.+?)\s+(\d+)(?::(\d+))?$/);if(!m){mensaje('Escribe una referencia como Génesis 1 o Génesis 1:1.');return;}const libro=m[1].trim(),cap=Number(m[2]),vers=m[3]?Number(m[3]):null;let btn=encontrar(libro,cap);if(!btn){const q=normalizar(libro);const c=[...document.querySelectorAll('#lista-indice button.indice-item')].filter(x=>{const d=obtenerCapitulo(x.dataset.referencia||x.textContent);return d&&d.capitulo===cap&&normalizar(d.libro).startsWith(q);});if(c.length===1)btn=c[0];}if(!btn){mensaje(`No encontré ${libro} ${cap} en la Biblia abierta.`);return;}btn.click();if(vers)setTimeout(()=>{const re=new RegExp(`^${vers}(?:\\s|$)`);const p=[...document.querySelectorAll('#contenido p')].find(x=>re.test(x.textContent.trim()));if(p){p.classList.add('versiculo-destacado');p.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>p.classList.remove('versiculo-destacado'),2200);}},120);}
    function observar(){const l=$('lista-indice');if(!l||l.dataset.fase1Observado==='1')return;l.dataset.fase1Observado='1';new MutationObserver(()=>{if(esIndiceBiblico())organizar();}).observe(l,{childList:true,subtree:true});}
    function instalar(){crearBuscador();observar();if(esIndiceBiblico())organizar();}
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',instalar,{once:true});else instalar();
  })();
  </script>
  <script src="assets/js/biblioteca.js"></script>
</body>
</html>
