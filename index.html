<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315c4b">
  <meta name="description" content="Biblioteca personal de estudio sin conexión.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/biblioteca.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Mi Biblioteca de Estudio</title>
</head>
<body>
  <header class="barra-superior">
    <button id="abrir-indice" class="solo-movil" aria-label="Abrir índice">☰</button>
    <div>
      <p class="marca">MI BIBLIOTECA</p>
      <h1 id="titulo-libro">Mi Biblioteca</h1>
    </div>
    <div class="acciones-superiores">
      <button id="abrir-buscador" class="secundario">🔎 Buscar</button>
      <button id="agregar-recurso">＋ Recurso</button>
      <button id="instalar" class="secundario" hidden>Instalar</button>
    </div>
  </header>

  <div id="pestanas" class="pestanas" aria-label="Recursos abiertos"></div>

  <main class="aplicacion">
    <aside id="panel-indice" class="indice" aria-label="Índice del libro">
      <div class="indice-cabecera">
        <h2>Índice</h2>
        <button id="cerrar-indice" class="solo-movil" aria-label="Cerrar índice">×</button>
      </div>
      <nav id="lista-indice"></nav>
    </aside>

    <section class="lector" aria-live="polite">
      <div class="herramientas">
        <div class="tamano" aria-label="Tamaño de letra">
          <span>Texto</span>
          <button id="disminuir" aria-label="Disminuir tamaño de letra">A−</button>
          <button id="aumentar" aria-label="Aumentar tamaño de letra">A+</button>
        </div>
        <div class="audio">
          <button id="escuchar">▶ Escuchar</button>
          <button id="pausar" disabled>⏸ Pausar</button>
          <button id="detener" disabled>■ Detener</button>
        </div>
      </div>
      <p id="estado" class="estado"></p>
      <article id="contenido" class="contenido"></article>
      <div class="navegacion">
        <button id="anterior" class="secundario">← Anterior</button>
        <button id="siguiente">Siguiente →</button>
      </div>
    </section>
  </main>

  <div id="modal-recursos" class="modal" hidden>
    <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="titulo-recursos">
      <div class="modal-cabecera">
        <div><p class="marca">MI BIBLIOTECA</p><h2 id="titulo-recursos">Agregar recurso</h2></div>
        <button id="cerrar-recursos" class="secundario" aria-label="Cerrar">×</button>
      </div>
      <p class="modal-ayuda">Elige un libro, Biblia, diccionario o léxico. Se abrirá como una nueva pestaña de estudio.</p>
      <div id="lista-recursos" class="lista-recursos"></div>
    </div>
  </div>

  <div id="modal-busqueda" class="modal" hidden>
    <div class="modal-caja modal-busqueda-caja" role="dialog" aria-modal="true" aria-labelledby="titulo-busqueda">
      <div class="modal-cabecera">
        <div><p class="marca">INVESTIGACIÓN</p><h2 id="titulo-busqueda">Buscar en la biblioteca</h2></div>
        <button id="cerrar-busqueda" class="secundario" aria-label="Cerrar">×</button>
      </div>
      <div class="busqueda-controles">
        <input id="campo-busqueda" type="search" placeholder="Palabra, frase, griego, español, Strong..." autocomplete="off">
        <select id="modo-busqueda" aria-label="Alcance de búsqueda">
          <option value="abiertos">En recursos abiertos</option>
          <option value="toda">En toda la biblioteca</option>
        </select>
        <button id="ejecutar-busqueda">Buscar</button>
      </div>
      <p id="estado-busqueda" class="estado"></p>
      <div id="resultados-busqueda" class="resultados-busqueda"></div>
    </div>
  </div>

  <!-- Adaptador adicional: se carga antes del lector y solo actúa sobre JSON bíblicos compatibles. -->
  <script src="assets/js/adaptadores-json.js"></script>
  <script src="assets/js/biblioteca.js"></script>
</body>
</html>
