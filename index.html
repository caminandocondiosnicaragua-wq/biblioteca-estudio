<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315c4b">
  <meta name="description" content="Biblioteca personal de estudio sin conexión.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/css/biblioteca.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Mi Biblioteca de Estudio</title>
</head>
<body>
  <header class="barra-superior">
    <button id="abrir-indice" class="solo-movil" aria-label="Abrir índice">☰</button>
    <div><p class="marca">MI BIBLIOTECA</p><h1 id="titulo-libro">Mi Biblioteca</h1></div>
    <div class="acciones-superiores">
      <button id="abrir-buscador" class="secundario">🔎 Buscar</button>
      <button id="agregar-recurso">＋ Recurso</button>
      <button id="instalar" class="secundario" hidden>Instalar</button>
    </div>
  </header>
  <div id="pestanas" class="pestanas" aria-label="Recursos abiertos"></div>
  <main class="aplicacion">
    <aside id="panel-indice" class="indice" aria-label="Índice del libro">
      <div class="indice-cabecera"><h2>Índice</h2><button id="cerrar-indice" class="solo-movil" aria-label="Cerrar índice">×</button></div>
      <nav id="lista-indice"></nav>
    </aside>
    <section class="lector" aria-live="polite">
      <div class="herramientas">
        <div class="tamano" aria-label="Tamaño de letra"><span>Texto</span><button id="disminuir" aria-label="Disminuir tamaño de letra">A−</button><button id="aumentar" aria-label="Aumentar tamaño de letra">A+</button></div>
        <div class="audio"><button id="escuchar">▶ Escuchar</button><button id="pausar" disabled>⏸ Pausar</button><button id="detener" disabled>■ Detener</button></div>
      </div>
      <p id="estado" class="estado"></p><article id="contenido" class="contenido"></article>
      <div class="navegacion"><button id="anterior" class="secundario">← Anterior</button><button id="siguiente">Siguiente →</button></div>
    </section>
  </main>
  <div id="modal-recursos" class="modal" hidden><div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="titulo-recursos"><div class="modal-cabecera"><div><p class="marca">MI BIBLIOTECA</p><h2 id="titulo-recursos">Agregar recurso</h2></div><button id="cerrar-recursos" class="secundario" aria-label="Cerrar">×</button></div><p class="modal-ayuda">Elige un libro, Biblia, diccionario o léxico. Se abrirá como una nueva pestaña de estudio.</p><div id="lista-recursos" class="lista-recursos"></div></div></div>
  <div id="modal-busqueda" class="modal" hidden><div class="modal-caja modal-busqueda-caja" role="dialog" aria-modal="true" aria-labelledby="titulo-busqueda"><div class="modal-cabecera"><div><p class="marca">INVESTIGACIÓN</p><h2 id="titulo-busqueda">Buscar en la biblioteca</h2></div><button id="cerrar-busqueda" class="secundario" aria-label="Cerrar">×</button></div><div class="busqueda-controles"><input id="campo-busqueda" type="search" placeholder="Palabra, frase, griego, español, Strong..." autocomplete="off"><select id="modo-busqueda" aria-label="Alcance de búsqueda"><option value="abiertos">En recursos abiertos</option><option value="toda">En toda la biblioteca</option></select><button id="ejecutar-busqueda">Buscar</button></div><p id="estado-busqueda" class="estado"></p><div id="resultados-busqueda" class="resultados-busqueda"></div></div></div>
  <script src="assets/js/adaptadores-json.js"></script>
  <script src="assets/js/biblioteca.js"></script>

  <!-- Navegación bíblica: libros → capítulos + búsqueda directa de citas. -->
  <script>
  (function(){
    const $=id=>document.getElementById(id);
    const normalizar=v=>String(v||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();

    function recursoBiblico(){
      return window.estado?.recursos?.get(window.estado?.activa)?.tipo === 'Biblia';
    }

    function separarCapitulo(titulo){
      const m=String(titulo||'').trim().match(/^(.+?)\s+(\d+)$/);
      return m ? {libro:m[1].trim(), capitulo:Number(m[2])} : null;
    }

    function obtenerLibros(recurso){
      const mapa=new Map();
      (recurso.nodos||[]).forEach((nodo,index)=>{
        const d=separarCapitulo(nodo.titulo);
        if(!d)return;
        const clave=normalizar(d.libro);
        if(!mapa.has(clave))mapa.set(clave,{nombre:d.libro,capitulos:[]});
        mapa.get(clave).capitulos.push({numero:d.capitulo,titulo:nodo.titulo,index});
      });
      return [...mapa.values()];
    }

    function instalarBuscador(){
      const indice=$('panel-indice');
      if(!indice||$('buscador-libros-biblico')||!recursoBiblico())return;
      const caja=document.createElement('div');
      caja.id='buscador-libros-biblico';
      caja.className='buscador-libros-biblico';
      caja.innerHTML='<label for="campo-libro-biblico">Buscar libro o cita</label><div class="buscador-libros-controles"><input id="campo-libro-biblico" type="search" placeholder="Ej.: Lucas · Juan 3:16" autocomplete="off"><button id="buscar-cita-biblica" type="button">Ir</button></div><small>Escribe un libro para localizarlo o una cita como Juan 3:16.</small><p id="estado-libro-biblico" class="estado-libro-biblico"></p>';
      indice.querySelector('.indice-cabecera').insertAdjacentElement('afterend',caja);

      const campo=$('campo-libro-biblico');
      const ejecutar=()=>buscarReferencia(campo?.value||'');
      $('buscar-cita-biblica').addEventListener('click',ejecutar);
      campo.addEventListener('keydown',e=>{if(e.key==='Enter')ejecutar();});
      campo.addEventListener('input',()=>filtrarLibros(campo.value));
    }

    function filtrarLibros(valor){
      const q=normalizar(valor);
      const lista=$('lista-indice');
      if(!lista)return;
      lista.querySelectorAll('.indice-libro').forEach(det=>{
        const nombre=normalizar(det.dataset.libro||'');
        det.hidden=Boolean(q&&!nombre.includes(q));
        if(q&&nombre.includes(q))det.open=true;
      });
      const estado=$('estado-libro-biblico');
      if(!q&&estado)estado.textContent='';
    }

    function construirIndice(){
      if(!recursoBiblico())return;
      const lista=$('lista-indice');
      const recurso=window.estado.recursos.get(window.estado.activa);
      if(!lista||!recurso)return;

      const libros=obtenerLibros(recurso);
      lista.replaceChildren();

      const actual=recurso.actual;
      const nodoActual=recurso.nodos[actual];
      const datosActual=separarCapitulo(nodoActual?.titulo||'');
      const libroActual=normalizar(datosActual?.libro||'');

      libros.forEach(libro=>{
        const detalles=document.createElement('details');
        detalles.className='indice-libro';
        detalles.dataset.libro=libro.nombre;
        detalles.open=normalizar(libro.nombre)===libroActual;

        const resumen=document.createElement('summary');
        resumen.textContent=libro.nombre;
        detalles.append(resumen);

        const capitulos=document.createElement('div');
        capitulos.className='indice-capitulos';
        libro.capitulos.forEach(cap=>{
          const boton=document.createElement('button');
          boton.type='button';
          boton.className=`indice-item ${cap.index===actual?'activo':''}`;
          boton.textContent=`${cap.numero}`;
          boton.title=cap.titulo;
          boton.dataset.indice=String(cap.index);
          boton.onclick=()=>window.abrirNodo(cap.index);
          capitulos.append(boton);
        });
        detalles.append(capitulos);
        lista.append(detalles);
      });
    }

    function localizarCapitulo(libro,capitulo){
      const recurso=window.estado?.recursos?.get(window.estado?.activa);
      if(!recurso)return null;
      const objetivo=normalizar(`${libro} ${capitulo}`);
      for(let i=0;i<(recurso.nodos||[]).length;i++){
        if(normalizar(recurso.nodos[i].titulo)===objetivo)return i;
      }
      return null;
    }

    function destacarVersiculo(numero){
      const elementos=[...document.querySelectorAll('#contenido p')];
      const patron=new RegExp(`^\\s*${Number(numero)}(?:[\\s.,;:]|$)`);
      const objetivo=elementos.find(p=>patron.test(p.textContent||''));
      if(!objetivo)return false;
      objetivo.classList.add('versiculo-destacado');
      objetivo.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'});
      setTimeout(()=>objetivo.classList.remove('versiculo-destacado'),5000);
      return true;
    }

    function buscarReferencia(valor){
      const texto=String(valor||'').trim();
      const estado=$('estado-libro-biblico');
      if(estado)estado.textContent='';
      if(!texto)return;

      const recurso=window.estado?.recursos?.get(window.estado?.activa);
      if(!recurso)return;

      /* Solo nombre de libro: lo localizamos y desplegamos sus capítulos. */
      const libros=obtenerLibros(recurso);
      const libroExacto=libros.find(x=>normalizar(x.nombre)===normalizar(texto));
      if(libroExacto){
        const detalles=[...document.querySelectorAll('.indice-libro')].find(x=>normalizar(x.dataset.libro)===normalizar(texto));
        if(detalles){detalles.open=true;detalles.scrollIntoView({behavior:'smooth',block:'nearest'});}
        if(estado)estado.textContent=`${libroExacto.nombre}: selecciona un capítulo.`;
        return;
      }

      const m=texto.match(/^(.+?)\s+(\d+)(?::(\d+))?$/);
      if(!m){
        if(estado)estado.textContent='Escribe un libro o una cita, por ejemplo: Juan 3:16.';
        return;
      }

      const libro=m[1].trim();
      const capitulo=Number(m[2]);
      const versiculo=m[3]?Number(m[3]):null;
      const indice=localizarCapitulo(libro,capitulo);

      if(indice===null){
        if(estado)estado.textContent=`No encontré ${libro} ${capitulo} en la Biblia abierta.`;
        return;
      }

      window.abrirNodo(indice);
      setTimeout(()=>{
        if(versiculo===null){
          document.querySelector('#contenido h2')?.scrollIntoView({behavior:'smooth',block:'start'});
          if(estado)estado.textContent=`Mostrando ${libro} ${capitulo}.`;
        }else{
          const ok=destacarVersiculo(versiculo);
          if(estado)estado.textContent=ok?`Mostrando ${libro} ${capitulo}:${versiculo}.`:`Llegué a ${libro} ${capitulo}, pero no pude localizar el versículo ${versiculo}.`;
        }
      },180);
    }

    function actualizar(){
      const caja=$('buscador-libros-biblico');
      if(recursoBiblico()){
        if(!caja)instalarBuscador();
        construirIndice();
      }else if(caja)caja.remove();
    }

    function observar(){
      const lista=$('lista-indice');
      const titulo=$('titulo-libro');
      if(lista&&!lista.dataset.indiceBiblicoObservado){
        lista.dataset.indiceBiblicoObservado='1';
        new MutationObserver(()=>setTimeout(actualizar,0)).observe(lista,{childList:true,subtree:true});
      }
      if(titulo&&!titulo.dataset.tituloBiblicoObservado){
        titulo.dataset.tituloBiblicoObservado='1';
        new MutationObserver(()=>setTimeout(actualizar,0)).observe(titulo,{childList:true,characterData:true,subtree:true});
      }
      actualizar();
    }

    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',observar,{once:true});
    else observar();
  })();
  </script>
</body>
</html>
