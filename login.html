<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Mi Biblioteca</title>
  <style>
    body{margin:0;background:#f7f5ee;font-family:Georgia,serif;color:#174d45}
    .card{width:min(430px,90%);margin:18vh auto 0;background:#fff;border:1px solid #d8ddd8;
      border-radius:14px;padding:32px;box-sizing:border-box;box-shadow:0 12px 30px #00000012}
    .brand{font-family:Arial,sans-serif;font-size:13px;font-weight:bold;letter-spacing:1px}
    h1{margin:6px 0 8px;font-size:32px}
    p{font-family:Arial,sans-serif;color:#555}
    label{display:block;font-family:Arial,sans-serif;font-weight:bold;margin:20px 0 7px}
    input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd5d0;border-radius:8px;font-size:16px}
    button{width:100%;margin-top:24px;padding:13px;border:0;border-radius:8px;background:#286451;color:white;
      font-size:16px;cursor:pointer}
    .forgot{text-align:center;margin-top:16px}
    .forgot a{font-family:Arial,sans-serif;color:#286451;text-decoration:none;font-weight:bold}
    #mensaje{text-align:center;color:#b52d2d;font-family:Arial,sans-serif;margin-top:14px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">MI BIBLIOTECA</div>
    <h1>Iniciar sesión</h1>
    <p>Accede a tu biblioteca privada de estudio.</p>

    <form id="loginForm">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" required autocomplete="email">

      <label for="password">Contraseña</label>
      <input id="password" type="password" required autocomplete="current-password">

      <button type="submit">Entrar</button>
    </form>

    <div class="forgot">
      <a href="forgot-password.html">¿Olvidaste tu contraseña?</a>
    </div>

    <div id="mensaje"></div>
  </main>

  <script type="module" src="supabase-config.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
