<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#315c4b">
  <title>Iniciar sesión · Mi Biblioteca</title>
  <link rel="stylesheet" href="assets/css/biblioteca.css">
  <style>
    .pagina-acceso{min-height:100vh;background:var(--crema)}
    .acceso{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
    .tarjeta-acceso{width:min(430px,100%);background:#fff;border:1px solid var(--linea);
      border-radius:14px;padding:2rem;box-shadow:0 12px 35px rgba(0,0,0,.08)}
    .tarjeta-acceso h1{color:var(--verde);margin:.2rem 0 .5rem;font-size:1.8rem}
    .texto-acceso{color:#51635a;margin:0 0 1.5rem;font: .95rem Arial,sans-serif}
    .tarjeta-acceso label{display:block;margin:1rem 0 .4rem;font:600 .9rem Arial,sans-serif}
    .tarjeta-acceso input{width:100%;padding:.75rem .8rem;border:1px solid var(--linea);
      border-radius:8px;background:#fff;color:var(--tinta)}
    .tarjeta-acceso input:focus{outline:2px solid #b8d0c3;border-color:var(--verde)}
    #boton-acceso{width:100%;margin-top:1.4rem;padding:.75rem 1rem}
    .mensaje-acceso{min-height:1.3rem;margin:.9rem 0 0;font:.9rem Arial,sans-serif;text-align:center}
    .mensaje-acceso.error{color:#9a3d32}.mensaje-acceso.ok{color:var(--verde)}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="pagina-acceso">
  <main class="acceso">
    <section class="tarjeta-acceso" aria-labelledby="titulo-acceso">
      <p class="marca">MI BIBLIOTECA</p>
      <h1 id="titulo-acceso">Iniciar sesión</h1>
      <p class="texto-acceso">Accede a tu biblioteca privada de estudio.</p>
      <form id="formulario-acceso">
        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" autocomplete="email" required>
        <label for="contrasena">Contraseña</label>
        <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>
        <button id="boton-acceso" type="submit">Entrar</button>
        <p id="mensaje-acceso" class="mensaje-acceso" role="alert"></p>
      </form>
    </section>
  </main>
  <script src="supabase-config.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
