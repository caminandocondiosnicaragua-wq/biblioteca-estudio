<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizar contraseña — Mi Biblioteca</title>

  <style>
    :root{
      --verde:#2f6655;
      --verde-oscuro:#1f5548;
      --fondo:#f7f4ec;
      --blanco:#ffffff;
      --borde:#d9ddd8;
      --texto:#183d35;
      --error:#c0392b;
      --ok:#2e7d5b;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--fondo);
      color:var(--texto);
      font-family:Georgia, "Times New Roman", serif;
    }

    .contenedor{
      width:min(430px, calc(100% - 32px));
      background:var(--blanco);
      border:1px solid var(--borde);
      border-radius:14px;
      padding:32px;
      box-shadow:0 8px 28px rgba(31,85,72,.10);
    }

    .marca{
      font-family:Arial, sans-serif;
      font-size:13px;
      font-weight:700;
      letter-spacing:.08em;
      color:var(--verde);
      margin-bottom:4px;
    }

    h1{
      margin:0 0 8px;
      font-size:32px;
      color:var(--verde-oscuro);
    }

    .descripcion{
      margin:0 0 26px;
      font-family:Arial, sans-serif;
      color:#53635e;
      line-height:1.5;
    }

    label{
      display:block;
      margin:15px 0 7px;
      font-family:Arial, sans-serif;
      font-weight:700;
      font-size:14px;
    }

    input{
      width:100%;
      padding:13px 14px;
      border:1px solid var(--borde);
      border-radius:8px;
      font-size:16px;
      outline:none;
    }

    input:focus{
      border-color:var(--verde);
      box-shadow:0 0 0 2px rgba(47,102,85,.12);
    }

    button{
      width:100%;
      margin-top:24px;
      padding:13px;
      border:0;
      border-radius:8px;
      background:var(--verde);
      color:white;
      font-family:Georgia, "Times New Roman", serif;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{background:var(--verde-oscuro)}
    button:disabled{opacity:.6;cursor:not-allowed}

    #mensaje{
      margin-top:16px;
      font-family:Arial, sans-serif;
      font-size:14px;
      line-height:1.5;
      text-align:center;
    }

    .error{color:var(--error)}
    .ok{color:var(--ok)}

    .oculto{display:none}

    .volver{
      display:block;
      margin-top:18px;
      text-align:center;
      color:var(--verde);
      font-family:Arial, sans-serif;
      text-decoration:none;
      font-size:14px;
    }
  </style>
</head>

<body>
  <main class="contenedor">
    <div class="marca">MI BIBLIOTECA</div>
    <h1>Nueva contraseña</h1>
    <p class="descripcion">
      Establece una nueva contraseña para acceder a tu biblioteca privada de estudio.
    </p>

    <form id="formulario" class="oculto">
      <label for="password">Nueva contraseña</label>
      <input id="password" type="password" autocomplete="new-password"
             minlength="6" required>

      <label for="confirmar">Confirmar contraseña</label>
      <input id="confirmar" type="password" autocomplete="new-password"
             minlength="6" required>

      <button id="boton" type="submit">Guardar nueva contraseña</button>
    </form>

    <p id="mensaje">Verificando el enlace de recuperación...</p>

    <a id="volver" class="volver oculto"
       href="login.html">Volver al inicio de sesión</a>
  </main>

  <!-- Biblioteca oficial de Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Configuración existente de tu proyecto -->
  <script src="supabase-config.js"></script>

  <script>
    const formulario = document.getElementById("formulario");
    const mensaje = document.getElementById("mensaje");
    const boton = document.getElementById("boton");
    const volver = document.getElementById("volver");

    function mostrarMensaje(texto, tipo = "") {
      mensaje.textContent = texto;
      mensaje.className = tipo;
    }

    async function prepararPagina() {
      try {
        // Supabase procesa el access_token del enlace de recuperación
        // que llega en el fragmento (#) de la URL.
        const { data, error } = await supabaseClient.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          mostrarMensaje(
            "El enlace de recuperación no es válido o ya expiró.",
            "error"
          );
          volver.classList.remove("oculto");
          return;
        }

        formulario.classList.remove("oculto");
        mensaje.textContent = "";
      } catch (error) {
        console.error(error);
        mostrarMensaje(
          "No fue posible validar el enlace de recuperación.",
          "error"
        );
        volver.classList.remove("oculto");
      }
    }

    formulario.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmar = document.getElementById("confirmar").value;

      if (password !== confirmar) {
        mostrarMensaje("Las contraseñas no coinciden.", "error");
        return;
      }

      if (password.length < 6) {
        mostrarMensaje(
          "La contraseña debe tener al menos 6 caracteres.",
          "error"
        );
        return;
      }

      boton.disabled = true;
      mostrarMensaje("Guardando nueva contraseña...");

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: password
        });

        if (error) throw error;

        formulario.classList.add("oculto");
        mostrarMensaje(
          "Contraseña actualizada correctamente. Ya puedes iniciar sesión.",
          "ok"
        );
        volver.classList.remove("oculto");

        await supabaseClient.auth.signOut();
      } catch (error) {
        console.error(error);
        mostrarMensaje(
          error.message || "No fue posible actualizar la contraseña.",
          "error"
        );
        boton.disabled = false;
      }
    });

    prepararPagina();
  </script>
</body>
</html>
